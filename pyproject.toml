[project]
name = "cmp180-evm-automation"
version = "0.1.0"
description = "CMP180 WLAN TX EVM automated measurement framework"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
hardware = [
    "RsInstrument>=1.126",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that require a real CMP180 connection (not run in normal CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
# 尚未逐模組加嚴；RsInstrument 等硬體套件沒有 type stub，先寬鬆設定避免噴出大量既有雜訊。
check_untyped_defs = false
