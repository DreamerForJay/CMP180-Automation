<script>
const $=selector=>document.querySelector(selector);let language='zh',traces=[];const colours=['#19d7e5','#f59e0b','#a78bfa','#47d88b','#f05261','#60a5fa','#f472b6','#eab308'];
document.querySelectorAll('nav button').forEach(button=>button.onclick=()=>{document.querySelectorAll('nav button,.view').forEach(node=>node.classList.remove('active'));button.classList.add('active');$('#'+button.dataset.view).classList.add('active')});
function translate(){document.documentElement.lang=language==='zh'?'zh-Hant':'en';document.querySelectorAll('[data-zh]').forEach(node=>node.textContent=node.dataset[language]);$('#language').textContent=language==='zh'?'EN':'中文'}
$('#language').onclick=()=>{language=language==='zh'?'en':'zh';translate()};let theme=localStorage.getItem('cmp180-cloud-theme')||'dark';function applyTheme(){document.documentElement.dataset.theme=theme;$('#theme').textContent=theme==='dark'?'☼':'☾'}$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('cmp180-cloud-theme',theme);applyTheme()};applyTheme();translate();
function number(value){const parsed=Number(value);return Number.isFinite(parsed)?parsed:null}function csvRows(text){const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);const headers=lines.shift().split(',').map(value=>value.trim());return lines.filter(Boolean).map(line=>{const values=line.split(',');return Object.fromEntries(headers.map((key,index)=>[key,values[index]?.trim()]))})}
function normalize(raw,index){const evm=number(raw.evm_all_db??raw.evm_all_carriers_db);return {point_index:number(raw.point_index)??index,frequency_hz:number(raw.frequency_hz),generator_power_dbm:number(raw.generator_power_dbm),evm_all_db:evm,evm_data_db:number(raw.evm_data_db??raw.evm_data_carriers_db),evm_pilot_db:number(raw.evm_pilot_db??raw.evm_pilot_carriers_db),burst_power_dbm:number(raw.burst_power_dbm),frequency_error_hz:number(raw.frequency_error_hz),valid:evm!==null&&String(raw.measurement_state||'').toUpperCase()!=='INV'}}
async function parseFile(file,index){const text=await file.text();let data=file.name.toLowerCase().endsWith('.csv')?csvRows(text):JSON.parse(text);if(!Array.isArray(data))data=data.points||data.results||[];const points=data.map(normalize);const fCount=new Set(points.map(p=>p.frequency_hz).filter(v=>v!==null)).size,pCount=new Set(points.map(p=>p.generator_power_dbm).filter(v=>v!==null)).size;return {name:file.name.replace(/\.(csv|json)$/i,''),color:colours[index%colours.length],visible:true,axis:pCount>fCount?'power':'frequency',points}}
$('#files').onchange=async event=>{const files=[...event.target.files].slice(0,8);if(!files.length)return;try{traces=await Promise.all(files.map(parseFile));traces=traces.filter(trace=>trace.points.length);render()}catch(error){alert((language==='zh'?'無法解析檔案：':'Unable to parse file: ')+error.message)}};
function render(){const points=traces.reduce((sum,trace)=>sum+trace.points.length,0);$('#empty').hidden=!!traces.length;$('#workspace').hidden=!traces.length;$('#runCount').textContent=traces.length;$('#pointCount').textContent=points;$('#visibleCount').textContent=traces.filter(trace=>trace.visible).length;$('#traces').innerHTML=traces.map((trace,index)=>`<label class="trace"><input type="checkbox" data-visible="${index}" ${trace.visible?'checked':''}><input type="color" data-color="${index}" value="${trace.color}"><input type="text" data-name="${index}" value="${escapeHtml(trace.name)}"><small>${trace.points.length} pts · ${trace.axis}</small></label>`).join('');draw()}
function escapeHtml(value){const span=document.createElement('span');span.textContent=value;return span.innerHTML}$('#traces').oninput=event=>{const index=Number(event.target.dataset.visible??event.target.dataset.color??event.target.dataset.name);if(!Number.isInteger(index))return;if(event.target.dataset.visible!==undefined)traces[index].visible=event.target.checked;if(event.target.dataset.color!==undefined)traces[index].color=event.target.value;if(event.target.dataset.name!==undefined)traces[index].name=event.target.value;$('#visibleCount').textContent=traces.filter(trace=>trace.visible).length;draw()};$('#metric').onchange=draw;$('#clear').onclick=()=>{traces=[];$('#files').value='';render()};
function draw(){const metric=$('#metric').value,visible=traces.filter(t=>t.visible),samples=[];visible.forEach(trace=>trace.points.forEach(point=>{const x=point[trace.axis==='power'?'generator_power_dbm':'frequency_hz'],y=point[metric];if(x!==null&&y!==null)samples.push({x,y})}));if(!samples.length){$('#chart').innerHTML='<text class="axis" x="50" y="80">No valid values</text>';return}const w=1000,h=360,p=52,xmin=Math.min(...samples.map(s=>s.x)),xmax=Math.max(...samples.map(s=>s.x)),rawMin=Math.min(...samples.map(s=>s.y)),rawMax=Math.max(...samples.map(s=>s.y)),margin=Math.max((rawMax-rawMin)*.15,.5),ymin=rawMin-margin,ymax=rawMax+margin,x=v=>p+(v-xmin)/(xmax-xmin||1)*(w-p*2),y=v=>h-p-(v-ymin)/(ymax-ymin||1)*(h-p*2);let html='';for(let i=0;i<5;i++){const yy=p+i*(h-p*2)/4;html+=`<line class="grid" x1="${p}" y1="${yy}" x2="${w-p}" y2="${yy}"/><text class="axis" x="8" y="${yy+4}">${(ymax-i*(ymax-ymin)/4).toFixed(1)}</text>`}visible.forEach(trace=>{const field=trace.axis==='power'?'generator_power_dbm':'frequency_hz';let segment=[];const flush=()=>{if(segment.length)html+=`<polyline fill="none" stroke="${trace.color}" stroke-width="3" points="${segment.map(point=>`${x(point[field])},${y(point[metric])}`).join(' ')}"/>`;segment=[]};trace.points.forEach(point=>{if(point.valid&&point[field]!==null&&point[metric]!==null)segment.push(point);else flush()});flush();trace.points.forEach(point=>{if(point[field]===null||point[metric]===null)return;html+=`<circle cx="${x(point[field])}" cy="${y(point[metric])}" r="4" fill="${point.valid?trace.color:'#f05261'}"><title>${escapeHtml(trace.name)} · ${point[metric]}</title></circle>`})});$('#chart').innerHTML=html}
if(window.google?.script?.run)google.script.run.withFailureHandler(()=>{}).getApplicationInfo();
</script>
