# CMP180 型錄能力只用於顯示與計畫預覽；不得直接作為 RF 執行權限。
# Catalog capabilities are display/planning bounds and never grant RF execution.
instrument_model: CMP180
catalog:
  frequency_min_hz: 400000000
  frequency_max_hz: 8000000000
  maximum_analysis_bandwidth_hz: 500000000
  analyzer_count: 2
  generator_count: 2
  rf_port_count: 16
  supports_list_mode: true
installed:
  # 必須由 *OPT?、CMsquares 與選件文件確認；未知值不可推定為已安裝。
  # Confirm with *OPT?, CMsquares, and option records; unknown is not installed.
  frequency_min_hz: 400000000
  frequency_max_hz: 8000000000
  # 2026-09-02 Python HIL 已使用匹配 waveform 驗證所有 WLAN 頻寬。
  analysis_bandwidths_hz: [20000000, 40000000, 80000000, 160000000, 320000000]
  analyzer_count: 1
  generator_count: 1
  rf_ports: [RF1.1, RF1.2, RF1.3, RF1.4, RF1.5, RF1.6, RF1.7, RF1.8, RF2.1, RF2.2, RF2.3, RF2.4, RF2.5, RF2.6, RF2.7, RF2.8]
approved_profile:
  # 2026-09-09 依 RF owner 指示放寬：本層改為「規劃安全包絡」，覆蓋 workflow 層
  # （frequency_sweep.py／power_sweep.py）物理保護以內的完整可量測範圍，
  # 不再以「該組合是否已完成 HIL」限制執行。
  #
  # 重要：本區塊已不代表 HIL 證據。實際完成實機驗證的組合一律只看 verified_hil，
  # 兩者不可互相引用；本層放行不等於該點已有 HIL 證據。
  #
  # 仍然擋得住的（由程式碼強制，改本檔案無法放寬）：
  #   - generator 功率上限 -30 dBm（direct loopback 無衰減器的輸入保護）
  #   - WLAN band 有效性與各 band 頻寬上限（2.4G≤40M、5G≤160M、6G≤320M）
  #   - 單次掃描不可跨 band（一次只載入一個 ARB waveform）
  #   - 頻率 400 MHz–8 GHz、dwell 0.01–10 秒、Generator／Analyzer port 必須不同
  profile_id: rf1.1-rf1.5-wlan-full-envelope-v4
  lifecycle: approved
  # 涵蓋 2.4／5／6 GHz 三個 WLAN band 的聯集；band 之間的非 WLAN 空隙仍由
  # workflow/wlan_bands.py 的 band 檢查擋下，不會因為這個外框而被放行。
  frequency_min_hz: 2400000000
  frequency_max_hz: 7125000000
  # 單一 band 的最大寬度就是 6 GHz band 的 1200 MHz；跨 band 本來就被擋，故此值即上限。
  maximum_span_hz: 1200000000
  bandwidths_hz: [20000000, 40000000, 80000000, 160000000, 320000000]
  # 功率上限與 workflow 的 -30 dBm 輸入保護對齊；下限放到規劃層的 -100 dBm。
  generator_power_min_dbm: -100
  generator_power_max_dbm: -30
  # 對齊 workflow 允許的 dwell 0.01–10 秒。
  dwell_min_ms: 10
  dwell_max_ms: 10000
  # 對齊 MAXIMUM_SWEEP_POINTS／MAXIMUM_PLANNING_PREVIEW_POINTS；此值只防呆，不是 RF 安全上限。
  maximum_points: 100000
  routes: [RF1.1-RF1.5]
  # 每個 band × 該 band 物理允許的每種頻寬，皆覆蓋該 band 的完整範圍。
  sections:
    - {key: 2.4GHz-bw20, frequency_min_hz: 2400000000, frequency_max_hz: 2500000000, bandwidth_hz: 20000000, maximum_points: 100000}
    - {key: 2.4GHz-bw40, frequency_min_hz: 2400000000, frequency_max_hz: 2500000000, bandwidth_hz: 40000000, maximum_points: 100000}
    - {key: 5GHz-bw20, frequency_min_hz: 5150000000, frequency_max_hz: 5895000000, bandwidth_hz: 20000000, maximum_points: 100000}
    - {key: 5GHz-bw40, frequency_min_hz: 5150000000, frequency_max_hz: 5895000000, bandwidth_hz: 40000000, maximum_points: 100000}
    - {key: 5GHz-bw80, frequency_min_hz: 5150000000, frequency_max_hz: 5895000000, bandwidth_hz: 80000000, maximum_points: 100000}
    - {key: 5GHz-bw160, frequency_min_hz: 5150000000, frequency_max_hz: 5895000000, bandwidth_hz: 160000000, maximum_points: 100000}
    - {key: 6GHz-bw20, frequency_min_hz: 5925000000, frequency_max_hz: 7125000000, bandwidth_hz: 20000000, maximum_points: 100000}
    - {key: 6GHz-bw40, frequency_min_hz: 5925000000, frequency_max_hz: 7125000000, bandwidth_hz: 40000000, maximum_points: 100000}
    - {key: 6GHz-bw80, frequency_min_hz: 5925000000, frequency_max_hz: 7125000000, bandwidth_hz: 80000000, maximum_points: 100000}
    - {key: 6GHz-bw160, frequency_min_hz: 5925000000, frequency_max_hz: 7125000000, bandwidth_hz: 160000000, maximum_points: 100000}
    - {key: 6GHz-bw320, frequency_min_hz: 5925000000, frequency_max_hz: 7125000000, bandwidth_hz: 320000000, maximum_points: 100000}
verified_hil:
  frequencies_hz: [2412000000, 2472000000, 5180000000, 5825000000, 5955000000, 7115000000]
  bandwidths_hz: [20000000, 40000000, 80000000, 160000000, 320000000]
  generator_powers_dbm: [-55, -50, -45, -40, -30]
  dwell_ms: [100, 200]
  routes: [RF1.1-RF1.5]
  # 2026-09-02 RF owner 已核准下列 11 個完成 HIL 的 section。
  sections: [2.4GHz-bw20, 2.4GHz-bw40, 5GHz-bw20, 5GHz-bw40, 5GHz-bw80, 5GHz-bw160, 6GHz-bw20, 6GHz-bw40, 6GHz-bw80, 6GHz-bw160, 6GHz-bw320]
