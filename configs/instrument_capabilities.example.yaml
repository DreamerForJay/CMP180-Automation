  # Confirm with *OPT?, CMsquares, and option records; unknown is not installed.
  frequency_min_hz: 400000000
  frequency_max_hz: 8000000000
  analysis_bandwidths_hz: [320000000]
  analyzer_count: 1
  generator_count: 1
  rf_ports: [RF1.1, RF1.2, RF1.3, RF1.4, RF1.5, RF1.6, RF1.7, RF1.8, RF2.1, RF2.2, RF2.3, RF2.4, RF2.5, RF2.6, RF2.7, RF2.8]
