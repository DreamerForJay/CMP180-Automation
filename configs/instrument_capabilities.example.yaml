# CMP180 型錄能力只用於顯示與計畫預覽；不得直接作為 RF 執行權限。
# Catalog capabilities are display/planning bounds and never grant RF execution.
instrument_model: CMP180
catalog:
  frequency_min_hz: 400000000
  frequency_max_hz: 8000000000
  maximum_analysis_bandwidth_hz: 500000000
  analyzer_count: 2
  generator_count: 2
  rf_port_count: 16
  supports_list_mode: true
installed:
