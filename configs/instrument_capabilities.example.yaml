  frequency_max_hz: 7125000000
  maximum_span_hz: 200000000
  bandwidths_hz: [320000000]
  generator_power_min_dbm: -60
  generator_power_max_dbm: -40
  dwell_min_ms: 100
  dwell_max_ms: 2000
  maximum_points: 11
  routes: [RF1.1-RF1.5]
