# CMP180 SCPI command map (SPEC.MD section 10.2).
#
# `common` is fixed to standard IEEE-488.2 commands and is safe to trust as-is.
# Everything under generator / wlan_tx / results MUST stay `null` until it has
# been captured from the CMP180 SCPI Recorder (or the official Remote Manual /
# built-in Command Help) and verified against real hardware — see the
# Discovery procedure in SPEC.MD section 11. Do not fill these in by guessing
# from other Rohde & Schwarz instruments (e.g. FSW85/K70); their SCPI trees
# are not guaranteed to match the CMP180.

common:
  identify: "*IDN?"
  options: "*OPT?"
  clear_status: "*CLS"
  operation_complete: "*OPC?"
  system_error: "SYST:ERR?"

generator:
  # Setter trees confirmed by CMP180 built-in Help. The controlled validation
  # script writes the already-read value back while RF is OFF.
  set_frequency: "SOURce:GPRF:GEN:RFSettings:FREQuency {frequency_hz}"
  set_power: "SOURce:GPRF:GEN:RFSettings:LEVel {power_dbm}"
  # RF state tree 已由內建 Help 確認；實機 pulse 驗證前仍須人工確認線材。
  rf_on: "SOURce:GPRF:GEN:STATe ON"
  rf_off: "SOURce:GPRF:GEN:STATe OFF"

# Query forms confirmed in CMP180 built-in Help. The discovery script checks
# each command against real hardware and reads SYST:ERR? after every query.
generator_query:
  frequency: "SOURce:GPRF:GEN:RFSettings:FREQuency?"
  level: "SOURce:GPRF:GEN:RFSettings:LEVel?"
  peak_power: "SOURce:GPRF:GEN:RFSettings:PEPower?"
  state: "SOURce:GPRF:GEN:STATe?"
  states: "SOURce:GPRF:GEN:STATe:ALL?"
  rf_path: "ROUTe:GPRF:GEN:SPATh?"

wlan_tx:
  # 內建 Help 已確認以下 setter tree；實機驗證工具只在 Generator 與
  # WLAN measurement 都為 OFF 時寫回目前值。
  set_rf_path: "ROUTe:WLAN:MEAS:SPATh {rf_path}"
  set_frequency: "CONFigure:WLAN:MEAS:RFSettings:FREQuency {frequency_hz}"
  set_bandwidth: "CONFigure:WLAN:MEAS:ISIGnal:BWIDth {bandwidth}"
  set_expected_power: "CONFigure:WLAN:MEAS:RFSettings:ENPower {expected_power_dbm}"
  set_external_attenuation: "CONFigure:WLAN:MEAS:RFSettings:EATTenuation {external_attenuation_db}"
  set_band: null
  adjust_level: null
  clear_statistics: null
  # 量測 lifecycle 命令由 CMP180 內建 Help 確認；驗證時 Generator 必須 OFF。
  initiate: "INITiate:WLAN:MEAS:MEValuation"
  stop: "STOP:WLAN:MEAS:MEValuation"
  abort: "ABORt:WLAN:MEAS:MEValuation"

# Query-only commands verified against CMP180 serial REDACTED on 2026-08-18.
wlan_tx_query:
  standard: "CONF:WLAN:MEAS:ISIG:STAN?"
  bandwidth: "CONF:WLAN:MEAS:ISIG:BWID?"
  rf_path_catalog: "CAT:WLAN:MEAS:SPAT?"
  rf_path: "ROUT:WLAN:MEAS:SPAT?"
  rf_path_count: "ROUT:WLAN:MEAS:SPAT:COUN?"
  external_attenuation: "CONF:WLAN:MEAS:RFSettings:EATT?"
  expected_nominal_power: "CONF:WLAN:MEAS:RFSettings:ENP?"
  band: "CONF:WLAN:MEAS:RFSettings:FREQ:BAND?"
  center_frequency: "CONF:WLAN:MEAS:RFSettings:FREQ?"
  channels: "CONF:WLAN:MEAS:RFSettings:FREQ:CHAN?"
  trigger_source_catalog: "TRIG:WLAN:MEAS:MEV:CAT:SOUR?"
  trigger_source: "TRIG:WLAN:MEAS:MEV:SOUR?"
  trigger_threshold: "TRIG:WLAN:MEAS:MEV:THR?"
  trigger_offset: "TRIG:WLAN:MEAS:MEV:OFFS?"
  trigger_min_gap: "TRIG:WLAN:MEAS:MEV:MGAP?"
  trigger_slope: "TRIG:WLAN:MEAS:MEV:SLOP?"
  trigger_timeout: "TRIG:WLAN:MEAS:MEV:TOUT?"
  measurement_state: "FETC:WLAN:MEAS:MEV:STAT?"
  measurement_states: "FETC:WLAN:MEAS:MEV:STAT:ALL?"

results:
  # Aggregate 28-field OFDM SISO result queries from CMP180 built-in WLAN help.
  # Hardware verification is performed by scripts/cmp180_wlan_result_discover.py.
  modulation_current: "FETC:WLAN:MEAS:MEV:MOD:CURR?"
  modulation_average: "FETC:WLAN:MEAS:MEV:MOD:AVER?"
  modulation_minimum: "FETC:WLAN:MEAS:MEV:MOD:MIN?"
  modulation_maximum: "FETC:WLAN:MEAS:MEV:MOD:MAX?"
  modulation_std_dev: "FETC:WLAN:MEAS:MEV:MOD:SDEV?"
  burst_power_current: null
  burst_power_average: null
  evm_all_current: null
  evm_all_average: null
  evm_all_max: null
  evm_all_std_dev: null
  evm_data_average: null
  evm_pilot_average: null
  frequency_error_average: null
  symbol_clock_error_average: null
