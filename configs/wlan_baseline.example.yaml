# Copy to wlan_baseline.yaml and adjust for the actual test point.
#
# 2026-07-28 update: the CMsquares GUI shows GPRF Gen 1 running in
# "Baseband Mode = ARB", i.e. it plays back a pre-built waveform file rather
# than generating WLAN parameters live via SCPI. The signal.* fields below
# are decoded from that file's name (the actual source of truth):
#
#   KV352_lib8_WLAN_11be_EHT_MU_BW320-1_4xLTF_GI32_MCS11_LEN4096_LDPC.wv
#     WLAN_11be   -> standard: EHT (802.11be)
#     EHT_MU      -> burst_type
#     BW320-1     -> bandwidth_hz: 320 MHz (this also resolves the earlier
#                    "Band=5GHz vs Frequency=6105MHz" inconsistency: a 320 MHz
#                    channel only exists in the 6 GHz band, so band=6_GHZ was
#                    correct all along)
#     4xLTF       -> ltf_size
#     GI32        -> guard_interval_us: 3.2
#     MCS11       -> mcs_index
#     LEN4096     -> payload_length_bytes
#     LDPC        -> coding
#
# Required option for ARB playback (from the GUI): (KW350 and KW352) or
# (KV350 and KV352) - cross-check against *OPT? during Discovery.
#
# generator.output_power_dbm describes the separate ARB generator example
# above. It is not the current WLAN TX analyzer input level.
#
# 2026-08-19 完整 Python loopback SingleShot 已驗證安全基準：Generator -40 dBm、
# Analyzer Expected Nominal Power -20 dBm、External Attenuation 0 dB。
# The complete Python loopback SingleShot verified the safe baseline:
# Generator -40 dBm, Analyzer Expected Nominal Power -20 dBm, and 0 dB
# External Attenuation.

test:
  id: wlan-baseline-001
  description: "CMP180 WLAN TX EVM baseline measurement"

signal:
  standard: "EHT"
  burst_type: "EHT_MU"

  band: "6_GHZ"
  center_frequency_hz: 6105000000

  bandwidth_hz: 320000000
  channel: null

  mcs_index: 11
  modulation: "1024QAM_5_6"

  spatial_streams: 1
  space_time_streams: 1

  guard_interval_us: 3.2
  ltf_size: "4XLTF"

  coding: "LDPC"
  payload_length_bytes: 4096

generator:
  enabled: true
  output_power_dbm: -40.0
  rf_on_at_start: false
  arb_waveform_file: "KV352_lib8_WLAN_11be_EHT_MU_BW320-1_4xLTF_GI32_MCS11_LEN4096_LDPC.wv"

analyzer:
  expected_nominal_power_dbm: -20.0 # verified by the complete Python SingleShot
  external_attenuation_db: 0.0
  user_margin_db: 3.0
  modulation_filter: "ALL"
  iq_swap: false
  trigger:
    source: "IF Power"
    threshold_db: -30.0
    offset_us: 0.0
    min_gap_us: 5.0
    slope: "RisingEdge"
    timeout_ms: 1000.0

measurement:
  mode: "multi_evaluation"
  burst_count: 10 # matches GUI "Statistic Count"; GUI baseline itself runs Repetition=Continuous
  timeout_s: 30
  clear_statistics_before_run: true
  adjust_level_before_run: true
  repetition: "single" # GUI baseline currently uses "continuous" for live monitoring - confirm which mode automation should use

output:
  save_csv: true
  save_json: true
  save_screenshots: false
  generate_plots: true
  generate_html_report: true
