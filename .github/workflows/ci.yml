name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run unit and mock tests
        run: python -m pytest -m "not hardware"
      - name: Validate example configurations
        shell: pwsh
        run: |
          python -m cmp180_evm validate-config configs/instrument.example.yaml
          python -m cmp180_evm validate-config configs/wlan_baseline.example.yaml
      - name: Lint
        # Ruff 已清除既有實質警告，新回歸必須擋下來。
        run: python -m ruff check .
      - name: Type-check (non-blocking)
        # mypy 仍有既有型別債；獨立執行才不會被 Ruff 的成功結果掩蓋。
        continue-on-error: true
        run: python -m mypy src

      # GitHub runner 無法連入公司 CMP180 網段；實機 RF 測試只在實驗室執行。
