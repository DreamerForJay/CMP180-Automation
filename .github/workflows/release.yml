name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要建立的版本標籤，例如 v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,build,hardware]"

      # 發布前仍跑一次非 hardware 測試與設定驗證，避免打包出未通過檢查的版本。
      # Runner 無法連入實驗室網段，這裡不會有任何實機 RF 行為。
      - name: Run unit and mock tests
        run: python -m pytest -m "not hardware"

      - name: Validate example configurations
        shell: pwsh
        run: |
          python -m cmp180_evm validate-config configs/instrument.example.yaml
          python -m cmp180_evm validate-config configs/wlan_baseline.example.yaml

      - name: Build portable package
        run: python scripts/build_windows.py

      - name: Verify portable package
        run: python scripts/verify_windows.py

      - name: Compute checksum
        id: sum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/CMP180-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round((Get-Item dist/CMP180-Windows-x64.zip).Length / 1MB, 1)
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$hash  CMP180-Windows-x64.zip" | Out-File -FilePath dist/CMP180-Windows-x64.zip.sha256 -Encoding ascii

      # 發行說明的內容放在 .github/release-notes.md，避免把 PowerShell here-string
      # 塞進 YAML 區塊純量——here-string 的結束符必須頂格，會直接破壞 YAML 縮排。
      - name: Write release notes
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ steps.sum.outputs.sha256 }}
          SIZE: ${{ steps.sum.outputs.size }}
        run: |
          $notes = Get-Content .github/release-notes.md -Raw -Encoding utf8
          $notes = $notes.Replace('{{TAG}}', $env:TAG).Replace('{{SHA}}', $env:SHA).Replace('{{SIZE}}', $env:SIZE)
          $notes | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create $env:TAG dist/CMP180-Windows-x64.zip dist/CMP180-Windows-x64.zip.sha256 --title "CMP180 $env:TAG Windows 可攜版" --notes-file release-notes.md
